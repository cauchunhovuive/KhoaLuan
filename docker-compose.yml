services:
  postgres:
    image: postgres:15-alpine
    container_name: khoaluan-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - khoaluan-network

  redis:
    image: redis:7-alpine
    container_name: khoaluan-redis
    ports:
      - "6379:6379"
    networks:
      - khoaluan-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: khoaluan-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${PORT}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN}
      - ML_SERVICE_URL=${ML_SERVICE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL}
      - VNP_TMN_CODE=${VNP_TMN_CODE}
      - VNP_HASH_SECRET=${VNP_HASH_SECRET}
      - VNP_URL=${VNP_URL}
      - VNP_RETURN_URL=${VNP_RETURN_URL}
      - VNP_IPN_URL=${VNP_IPN_URL}
      - MOMO_PARTNER_CODE=${MOMO_PARTNER_CODE}
      - MOMO_ACCESS_KEY=${MOMO_ACCESS_KEY}
      - MOMO_SECRET_KEY=${MOMO_SECRET_KEY}
      - MOMO_API_URL=${MOMO_API_URL}
      - MOMO_REDIRECT_URL=${MOMO_REDIRECT_URL}
      - MOMO_IPN_URL=${MOMO_IPN_URL}
    depends_on:
      - postgres
      - redis
      - ml-service
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - khoaluan-network

  ml-service:
    build:
      context: ./backend/ml
      dockerfile: Dockerfile.ml
    container_name: khoaluan-ml
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - AI_PROVIDER=${AI_PROVIDER}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - AI_TIMEOUT=${AI_TIMEOUT:-30}
      - OLLAMA_HOST=${OLLAMA_HOST}
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - postgres
    volumes:
      - ./backend/ml:/app
    networks:
      - khoaluan-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: khoaluan-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=${VITE_API_URL}
      - VITE_ML_API_URL=${VITE_ML_API_URL}
      - VITE_API_PROXY_TARGET=http://backend:5000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - khoaluan-network

volumes:
  postgres_data:

networks:
  khoaluan-network:
    driver: bridge
